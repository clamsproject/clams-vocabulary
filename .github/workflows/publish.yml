name: "📦 Publish (PyPI + docs)"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.1.1)'
        required: true

jobs:
  check-pypi:
    name: "🔍 Check PyPI for existing package"
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        run: |
          PACKAGE=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '-' '_')
          VERSION=${{ inputs.version || github.ref_name }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Package $PACKAGE $VERSION already exists on PyPI, skipping upload"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package $PACKAGE $VERSION not found on PyPI, proceeding with upload"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  publish-pypi:
    name: "📦 Build and upload to PyPI"
    needs: check-pypi
    if: needs.check-pypi.outputs.exists == 'false'
    runs-on: ubuntu-latest
    env:
      OS: linux
      PYTHON: '3.10'
    steps:
      - name: "🏷 Prepare package metadata"
        run: |
          echo "VERSION=${{ needs.check-pypi.outputs.version }}" >> $GITHUB_ENV
          echo "PACKAGE=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '-' '_')" >> $GITHUB_ENV

      - name: "🛍 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: "🏗 Build package"
        run: python3 build-tools/build.py

      - name: "🧪 Run tests"
        run: python3 build-tools/test.py

      - name: "📓 Generate changelog and upload to PyPI"
        run: python3 build-tools/publish.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPITOKEN }}

      - name: "🫙 Commit and push changelog"
        run: |
          git config --local user.email "admin@clams.ai"
          git config --local user.name "clams-bot"
          for f in CHANGELOG.md; do if [ -e $f ]; then git add $f; fi; done
          git diff --cached --quiet || git commit -m 'Updated CHANGELOG'
          git push origin HEAD:main

  publish-docs:
    name: "📖 Build and publish docs"
    needs: [check-pypi, publish-pypi]
    if: always() && needs.check-pypi.result == 'success' && needs.publish-pypi.result != 'failure'
    uses: clamsproject/clamsproject.github.io/.github/workflows/sdk-docs.yml@main
    with:
      source_repo: clamsproject/clams-vocabulary
      source_ref: ${{ needs.check-pypi.outputs.version }}
      project_name: vocabulary
      version: ${{ needs.check-pypi.outputs.version }}
      build_command: 'python3 build-tools/docs.py --output-dir _docs'
    secrets: inherit
