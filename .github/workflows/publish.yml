name: "📦 Publish (PyPI + docs)"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.1.1)'
        required: true

jobs:
  check-pypi:
    name: "🔍 Check PyPI for existing package"
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        run: |
          PACKAGE=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '-' '_')
          VERSION=${{ inputs.version || github.ref_name }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Package $PACKAGE $VERSION already exists on PyPI, skipping upload"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package $PACKAGE $VERSION not found on PyPI, proceeding with upload"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  codegen-check:
    name: "🔍 Verify codegen is up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e .[dev]
      - run: python3 build-tools/generate_vocab_snapshot.py build
      - name: Fail if codegen drift detected
        run: |
          if ! git diff --exit-code -- 'clams_vocabulary/'; then
            echo "::error::Generated files don't match archetypes. Run codegen locally and commit."
            exit 1
          fi

  publish-pypi:
    name: "📦 Build and upload to PyPI"
    needs: [check-pypi, codegen-check]
    if: needs.check-pypi.outputs.exists == 'false'
    uses: clamsproject/.github/.github/workflows/sdk-publish-pyproj.yml@main
    secrets: inherit

  publish-docs:
    name: "📖 Build and publish docs"
    needs: [check-pypi, codegen-check, publish-pypi]
    if: always() && needs.codegen-check.result == 'success' && needs.check-pypi.result == 'success' && needs.publish-pypi.result != 'failure'
    uses: clamsproject/clamsproject.github.io/.github/workflows/sdk-docs.yml@main
    with:
      source_repo: clamsproject/clams-vocabulary
      source_ref: ${{ needs.check-pypi.outputs.version }}
      project_name: vocabulary
    secrets: inherit
